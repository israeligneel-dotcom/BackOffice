<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="spider-bg">

    <div class="container">
        <div class="card">
            <div class="logo-area">
                <div class="logo-badge">
                    <i class="fa-solid fa-spider"></i>
                </div>
                <h1>Backoffice</h1>
                <p>Ingresa a tu panel de control</p>
            </div>

            <form id="loginForm" class="form">
                <div class="input-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Correo electronico</label>
                    <input type="email" id="email" placeholder="usuario@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Contrasena</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    <span>Iniciar sesion</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <div class="card-footer">
                <p>No tienes cuenta? <a href="register.html">Registrate aqui</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Acceso Denegado',
                text: 'El modulo de autenticacion estara disponible en la siguiente fase.',
                icon: 'info',
                background: '#12131a',
                color: '#ffffff',
                confirmButtonColor: '#e31b23'
            });
        });
    </script>
</body>
</html>
